- title: Dynamic Monopsony and Human Capital
  link: /assets/papers/JMP_Jungerman.pdf
  status: "New draft! First draft: November 2023."
  bibtex: |
    @unpublished{
      jungerman2026,
      author={Jungerman, William},
      title={Dynamic Monopsony and Human Capital},
      year={2026}, 
      note={Working Paper}
    }
  abstract: How does dynamic labor supply change the measurement and welfare costs of monopsony? I develop a dynamic model in which a large employer competes with smaller firms for workers who accumulate human capital. The large firm internalizes how its wages shape human capital and employment across the market. Hence, the labor supply elasticity is no longer a sufficient statistic for how far wages fall below their efficient level. I characterize the efficient allocation and show that wages equal to static marginal products implement it. To quantify the losses, I solve the model with deep learning and estimate it on French matched employer–employee data. Across two representative markets, monopsony lowers welfare by 2.6% on average. Inferring productivity from a static wage equation overstates the dominant employer’s productivity and makes wages appear further below their efficient level, yet understates the welfare cost of monopsony by 22% on average.
- title: There’s Nothing in the Air
  coauthors:
    - name: Jacob Adenbaum
      link: https://jacobadenbaum.github.io/
    - name: Fil Babalievsky
      link: http://fil-babalievsky.squarespace.com/
  link: /assets/papers/urban_data.pdf
  status: "New draft! First draft: October 2025."
  bibtex: |
    @unpublished{
      There_s_Nothing_in_the_Air,
      author={Jacob Adenbaum and Fil Babalievsky and William Jungerman},
      title={There’s Nothing in the Air},
      year={2026},
      note={Working Paper}
    }
  abstract: Why do wages grow faster in bigger cities? We use French administrative data to decompose the urban wage growth premium and find that the answer has surprisingly little to do with cities themselves. While we document substantially faster wage growth in larger cities, 57% of the premium is accounted for by the composition of firms and coworkers. We also document significantly higher job-to-job transition rates in larger cities, suggesting workers climb the job ladder faster. Most strikingly, when we focus on workers who remain in the same job, eliminating the job ladder mechanism, the premium falls 84% below the full-sample baseline once firms and coworkers are accounted for. These results challenge the view that cities generate human capital spillovers “in the air,” suggesting instead that urban wage dynamics reflect the sorting of firms and workers and the pace of job mobility.
- title: "Product Market Power as a Labor Distortion: the Case of Home Production Substitutes"
  coauthors:
    - name: Stan Rabinovich
      link: https://sites.google.com/site/stanrabinovicheconomics/
    - name: Bailey Sanders
      link: https://sites.google.com/view/baileyksanders/
  link: /assets/papers/home_substitutes.pdf
  status: "New draft! First draft: August 2025."
  bibtex: |
    @unpublished{
      Home_Subs,
      author={William Jungerman and Stanislav Rabinovich and Bailey Sanders},
      title={Product Market Power as a Labor Distortion: the Case of Home Production Substitutes},
      year={2026}, 
      note={Working Paper}
    }
  abstract: We introduce monopolistic competition in markets for home production substitutes into a model of household time allocation and study the implications for female labor supply. Households in our model consume market goods and home-produced goods; the latter are produced using a combination of the wife’s time and home inputs, where the market for home inputs is monopolistically competitive. The resulting markups on home inputs are endogenous and depend on both the elasticity of substitution between products and the home production technology. Markups directly raise the price of outsourcing housework and thereby reduce female labor supply; we show theoretically that markups can also amplify or dampen the effect of other economic forces, such as the cost of home inputs and the gender wage gap. We estimate our model using a combination of time allocation, expenditure, and markup data. Our estimates imply that endogenous markups amplify the labor supply effects of technological progress in housework substitutes by approximately 12%. The framework identifies a distinct channel through which product market power shapes female labor supply, operating through household time allocation.
- title: Learning on the Job
  coauthors:
    - name: Jacob Adenbaum
      link: https://jacobadenbaum.github.io/
    - name: Fil Babalievsky
      link: http://fil-babalievsky.squarespace.com/
  link: https://jacobadenbaum.github.io/Learning_on_the_Job/
  status: "New draft coming soon!"
  bibtex: |
    @unpublished{
      Learning_on_the_Job,
      author={Jacob Adenbaum and Fil Babalievsky and William Jungerman},
      title={Learning on the Job},
      year={2024}, 
      note={Working Paper}
    }
  abstract: What are the sources of worker learning within the firm? How much of a worker's human capital growth comes from firm specific factors, such as the learning environment, as opposed to their own ability, and the composition of their coworkers?  In this paper, we introduce a novel labor search model with multi-worker firms, learning from coworkers, and heterogeneity in learning-by-doing rates that can vary at the worker and firm level. Despite its complexity, we show that it is possible to solve such a model by leveraging recent advances from the machine learning literature. We use French administrative data to discipline the parameters of the model, specifically by targeting how wage growth varies across workers, firms, and the distribution of coworker wages.  With the calibrated model in hand we perform a series of structural and statistical decompositions to test how much of the variance of human capital is driven by learning from coworkers and by heterogeneous learning-by-doing, and find that learning from coworkers is the dominant source of learning in the economy. Switching off learning from coworkers lowers human capital and wages by more than 25%, and differences in the composition of coworkers accounts for more than 50% of the variance of human capital growth rates. Finally, we use the model to calculate dynamic markdowns that price in the benefits of learning on the job and find that markdowns are less than 5% on average for workers with more than 1 year of experience at their current firm.
- title: Deep Reinforcement Learning for Economics
  coauthors:
    - name: Jacob Adenbaum
      link: https://jacobadenbaum.github.io/
    - name: Fil Babalievsky
      link: http://fil-babalievsky.squarespace.com/
  link: https://jacobadenbaum.github.io/DRL/
  status: "New draft coming soon!"
  bibtex: |
    @unpublished{
      DRL,
      author={Jacob Adenbaum and Fil Babalievsky and William Jungerman},
      title={Deep Reinforcement Learning for Economics},
      year={2024}, 
      note={Working Paper}
    }
  abstract: This paper provides a self-contained guide to deep reinforcement learning methods for economists. These tools allow agents to find the policy function that maximizes their expected discounted stream of rewards under very few assumptions about the structure of the model, and are potentially applicable to a wide class of economic models. We begin by translating the language of reinforcement learning to the language of economics. Next, we introduce neural networks, a class of function approximators that have proven useful for reinforcement learning. We use a standard Bewley (1977)-style consumption-savings problem as our test case since we can easily check for correctness. We conclude by offering a practical guide with implementation details and a discussion of what kinds of problems are more amenable to reinforcement learning than conventional techniques.
- title: Average Match Quality over the Business Cycle
  link: /assets/papers/Jungerman_AMQ.pdf
  status: "Resting."
  bibtex: |
    @unpublished{
      jungerman2022,
      author={Jungerman, William},
      title={Average Match Quality over the Business Cycle},
      year={2022}, 
      note={Working Paper}
    }
  abstract: "This paper examines how the business cycle impacts the average quality of an employer-employee match. I study a model of the labor market with on-the-job search, aggregate uncertainty, and heterogeneous match qualities. I test two theories: the cleansing effect, whereby the low quality matches are destroyed during recessions, and the sullying effect, whereby firms post fewer vacancies during recessions and workers have fewer opportunities to move up the job ladder. I find that the sullying effect dominates and that average match quality is procyclical due to increased hiring out of unemployment during recessions. I extend the model to allow for an exogenous minimum wage and show that neglecting to account for the cyclicality of match qualities can lead to miscalculating the effects of the policy."

